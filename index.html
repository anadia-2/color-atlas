<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색채의 세계 · Color Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F4;--ink:#1B1A18;--sub:#6B665E;--line:#E6E1D8;--card:#FFFFFF;--accent:#1F4E89;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
.serif{font-family:"Noto Serif KR",serif}
header.top{position:sticky;top:0;z-index:20;background:rgba(250,248,244,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Noto Serif KR",serif;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo-dots{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.logo-dots i{width:7px;height:7px;border-radius:2px;display:block}
.logo small{font-family:"Noto Sans KR";font-weight:500;font-size:12px;color:var(--sub);letter-spacing:.06em}
nav.menu{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.menu a{text-decoration:none;padding:7px 12px;border-radius:999px;font-size:14px;color:var(--sub);font-weight:500}
nav.menu a:hover{background:#EFEBE3;color:var(--ink)}
.langbtn{margin-left:8px;border:1px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.langbtn:hover{background:var(--ink);color:#fff}
nav.menu a.on{background:var(--ink);color:#fff}
main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
h1,h2,h3{font-family:"Noto Serif KR",serif;letter-spacing:-.02em;line-height:1.3}
h2{font-size:24px;margin:44px 0 6px}
.lead{color:var(--sub);margin:0 0 18px}
/* search */
.search{position:relative;max-width:640px}
.search-row{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:6px 6px 6px 18px}
.search-row input[type=text]{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:transparent;min-width:0}
.picker{width:38px;height:38px;border:0;padding:0;border-radius:50%;overflow:hidden;cursor:pointer;background:none}
.picker::-webkit-color-swatch-wrapper{padding:0}.picker::-webkit-color-swatch{border:1px solid var(--line);border-radius:50%}
.btn{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.08);overflow:hidden;z-index:30;display:none}
.sugg a{display:flex;align-items:center;gap:12px;padding:9px 14px;text-decoration:none;font-size:14px}
.sugg a:hover,.sugg a.sel{background:#F3F0EA}
.sugg .sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.08);flex:none}
.sugg .hx{margin-left:auto;color:var(--sub);font-family:ui-monospace,monospace;font-size:12px}
/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center;padding:20px 0 10px}
.hero h1{font-size:44px;margin:0 0 10px}
.hero p{color:var(--sub);font-size:17px;margin:0 0 22px}
.hero-mosaic{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;border-radius:var(--r);overflow:hidden}
.hero-mosaic a{aspect-ratio:1;display:block;transition:transform .15s}
.hero-mosaic a:hover{transform:scale(1.12);position:relative;z-index:2;border-radius:4px}
.hint{font-size:13px;color:var(--sub);margin-top:10px}
.hint code{background:#EFEBE3;padding:1px 6px;border-radius:5px;font-size:12px}
.today{display:grid;grid-template-columns:260px 1fr;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);text-decoration:none}
.today .sw{min-height:200px;display:flex;align-items:flex-end;padding:16px;font-family:ui-monospace,monospace;font-size:14px}
.today .tx{padding:22px 26px}
.today .tx h3{margin:4px 0 8px;font-size:26px}
.kicker{font-size:12px;letter-spacing:.12em;color:var(--sub);text-transform:uppercase;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-decoration:none;display:block;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card h3{margin:10px 0 4px;font-size:19px}
.card p{margin:0;color:var(--sub);font-size:14px}
.strip{display:flex;height:34px;border-radius:8px;overflow:hidden}
.strip i{flex:1}
/* grid of swatches */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;display:block;transition:transform .12s, box-shadow .12s}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.chip .sw{height:84px}
.chip .nm{padding:8px 10px 10px;font-size:13px;line-height:1.35}
.chip .nm b{display:block;font-weight:700;font-size:14px}
.chip .nm span{color:var(--sub);font-size:12px}
.chip .nm code{font-size:11px;color:var(--sub)}
.fam-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.fam-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.fam-tabs button i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.1)}
.fam-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.spectrum-wrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:crosshair}
#spec{display:block;width:100%;height:280px}
#grayspec{display:block;width:100%;height:36px;cursor:crosshair}
.spec-tip{position:absolute;pointer-events:none;background:rgba(0,0,0,.75);color:#fff;font-family:ui-monospace,monospace;font-size:12px;padding:3px 7px;border-radius:6px;display:none}
/* color page */
.cp-hero{border-radius:20px;padding:34px 34px 28px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.cp-hero h1{font-size:46px;margin:0}
.cp-hero .en{font-size:18px;opacity:.85;margin-top:2px}
.cp-hero .codes{font-family:ui-monospace,monospace;font-size:15px;opacity:.9}
.cp-hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;border:1px solid currentColor;border-radius:999px;padding:2px 10px;opacity:.85}
.cp-nav{position:absolute;top:20px;right:20px;display:flex;gap:6px}
.cp-nav button{background:rgba(255,255,255,.18);border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 12px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.panel h3{margin:0 0 12px;font-size:17px}
.codes-table{width:100%;border-collapse:collapse;font-size:14px}
.codes-table td{padding:7px 0;border-bottom:1px solid #F0ECE5}
.codes-table td:first-child{color:var(--sub);width:70px;font-size:12px;font-weight:700;letter-spacing:.06em}
.codes-table td:nth-child(2){font-family:ui-monospace,monospace}
.codes-table td:last-child{text-align:right;width:56px}
.copy{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;padding:2px 8px;color:var(--sub)}
.copy:hover{border-color:var(--ink);color:var(--ink)}
.story{background:var(--card);border:1px solid var(--line);border-left:6px solid;border-radius:var(--r);padding:22px 26px;margin-top:20px}
.story h3{margin:2px 0 10px;font-size:20px}
.story p{margin:0 0 8px;font-size:15.5px}
.story .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin-bottom:10px}
.auto-desc{font-size:16px;margin:18px 0 0;padding:16px 20px;background:#F3F0EA;border-radius:12px}
.near{display:flex;flex-direction:column;gap:8px}
.near a{display:flex;align-items:center;gap:12px;text-decoration:none;padding:6px;border-radius:10px}
.near a:hover{background:#F6F3EE}
.near .sw{width:42px;height:42px;border-radius:9px;flex:none;border:1px solid rgba(0,0,0,.06)}
.near b{font-size:14px;display:block}
.near span{font-size:12px;color:var(--sub)}
.near .de{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;font-family:ui-monospace,monospace}
.harm{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.harm .h-name{font-size:13px;font-weight:700;margin-bottom:6px}
.harm .h-name span{font-weight:400;color:var(--sub)}
.harm .row{display:flex;height:64px;border-radius:10px;overflow:hidden}
.harm .row a{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;font-family:ui-monospace,monospace;text-decoration:none}
.scale{display:flex;border-radius:12px;overflow:hidden;height:70px}
.scale a{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;font-family:ui-monospace,monospace;text-decoration:none}
.scale a.cur{flex:1.6;font-weight:700;font-size:11px}
.cb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cb div{text-align:center;font-size:12px;color:var(--sub)}
.cb i{display:block;height:64px;border-radius:10px;margin-bottom:6px;border:1px solid rgba(0,0,0,.06)}
.contrast{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contrast>div{border-radius:10px;padding:14px;font-size:14px;border:1px solid var(--line)}
.contrast b{font-size:20px;display:block}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:4px}
.ok{background:#DCEFE0;color:#1E6B34}.no{background:#F6DEDB;color:#9A2A1F}
/* korean */
.obang{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,auto);gap:10px;max-width:560px}
.obang a{aspect-ratio:1;border-radius:14px;padding:14px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between}
.obang a b{font-family:"Noto Serif KR";font-size:30px;line-height:1}
.obang a span{font-size:12px;line-height:1.45}
.obang-wrap{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.ogan{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ogan a{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ogan .sw{height:90px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif KR";font-size:28px}
.ogan .f{padding:10px 12px;font-size:13px}
.ogan .f b{display:block;font-size:15px}
.mix{display:flex;align-items:center;gap:4px;margin-top:4px;color:var(--sub);font-size:12px}
.mix i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.1)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;transition:border-color .15s}
.tcard:hover{border-color:var(--ink)}
.tcard .sw{width:64px;height:64px;border-radius:10px;flex:none}
.tcard b{font-size:15px}
.tcard .hj{color:var(--sub);font-size:12px;margin-left:4px}
.tcard p{margin:2px 0 0;font-size:13px;color:var(--sub);line-height:1.5}
.vs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vs .card{cursor:default}
.vs .card:hover{transform:none;border-color:var(--line)}
.pair{display:flex;gap:6px;margin-bottom:10px}
.pair a{flex:1;height:60px;border-radius:10px;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;text-decoration:none;font-weight:500}
/* timeline */
.tl{position:relative;padding-left:34px}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:18px}
.tl-dot{position:absolute;left:-34px;top:18px;width:24px;height:24px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.tl-card{display:grid;grid-template-columns:150px 1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;transition:border-color .15s}
.tl-card:hover{border-color:var(--ink)}
.tl-card .sw{min-height:130px}
.tl-card .bd{padding:16px 20px}
.tl-card .era{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sub)}
.tl-card h3{margin:2px 0 6px;font-size:19px}
.tl-card h3 span{font-family:"Noto Sans KR";font-weight:400;font-size:13px;color:var(--sub);margin-left:6px}
.tl-card p{margin:0;font-size:14px;color:#3E3A34}
footer{border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;padding:24px 20px 40px;max-width:1120px;margin:0 auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}.hero h1{font-size:34px}
  .cards,.vs{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .today{grid-template-columns:1fr}.today .sw{min-height:120px}
  .ogan{grid-template-columns:repeat(2,1fr)}
  .obang-wrap{grid-template-columns:1fr}
  .tl-card{grid-template-columns:1fr}.tl-card .sw{min-height:70px}
  .cp-hero h1{font-size:34px}.cp-hero{padding:24px}
  .cb{grid-template-columns:repeat(2,1fr)}
  nav.menu{margin-left:0}
}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 22px;overflow-x:auto}
.subtabs a{padding:10px 16px;text-decoration:none;color:var(--sub);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs a.on{color:var(--ink);border-color:var(--ink)}
.muted{color:var(--sub)}
.btn.sm{padding:5px 11px;font-size:12.5px;margin:0 4px 6px 0}
.btn:disabled{opacity:.4;cursor:default}
.outfit{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
.fig-col{position:sticky;top:76px}
.fig-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fig{width:100%;height:auto;display:block;max-height:400px}
.fig path{cursor:pointer}
.slotbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.slotbtns button{display:grid;grid-template-columns:18px 1fr;column-gap:8px;text-align:left;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:500}
.slotbtns button i{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.12);grid-row:span 2}
.slotbtns button small{color:var(--sub);font-weight:400;font-size:11.5px}
.slotbtns button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.slotbtns button.off{opacity:.45}
.toggle{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.gsws{display:flex;flex-wrap:wrap;gap:6px}
.gsw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:2px;width:64px;font-size:11px;color:var(--ink);line-height:1.25}
.gsw i{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block;transition:transform .12s}
.gsw:hover i{transform:scale(1.1)}
.gsw.on i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.panel h3 .picker.sm{width:28px;height:28px;vertical-align:middle;margin-left:6px}
.rec{padding:12px 0;border-top:1px solid #F0ECE5}
.rec-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.rec-h span{font-size:12.5px;color:var(--sub)}
.notes{margin:0;padding:0;list-style:none}
.notes li{padding:8px 0 8px 26px;position:relative;font-size:14.5px;border-top:1px solid #F0ECE5}
.notes li:first-child{border-top:0}
.notes li:before{position:absolute;left:4px;top:8px;font-weight:700}
.notes li.n-ok:before{content:"✓";color:#1E6B34}
.notes li.n-mid:before{content:"!";color:#9A6A00}
.notes li.n-warn:before{content:"!";color:#9A2A1F}
.qz{padding:10px 0;border-top:1px solid #F0ECE5}
.qz b{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.qz button,.seg button,.simbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;margin:0 4px 4px 0}
.qz button.on,.simbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seasontabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 16px}
.seasontabs button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:8px}
.seasontabs button .strip{height:20px;border-radius:6px;width:100%}
.seasontabs button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.drapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.drape{border-radius:14px;padding:16px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid rgba(0,0,0,.08)}
.drape .face{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#f3efe9}
.drape .face img,.drape .face svg{width:100%;height:100%;object-fit:cover;display:block}
.drape span{font-size:12px;font-weight:500;text-align:center}
.chart-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.ctl .kicker{margin:16px 0 6px}
.ctl .kicker:first-child{margin-top:0}
.seg{display:flex;flex-direction:column;gap:6px}
.seg button{border-radius:10px;text-align:left;padding:8px 12px;margin:0}
.seg button small{display:block;color:var(--sub);font-size:11.5px}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg.two-s{flex-direction:row}
.seg.two-s button{flex:1;text-align:center}
.ctl select{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:14px;background:#fff}
.ctl input[type=range]{width:100%}
.crow{display:flex;gap:8px;align-items:center}
.tin{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:ui-monospace,monospace;font-size:14px}
.palrow{display:flex;border-radius:12px;overflow:hidden}
.pal{flex:1;border:0;height:84px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:8px;font-family:ui-monospace,monospace;font-size:11px;min-width:0;overflow:hidden}
.pal span{font-size:13px;font-weight:700;font-family:"Noto Sans KR",sans-serif}
.pal{font-family:ui-monospace,monospace}
.copyrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px}
.copyrow .copy{padding:4px 10px}
.simbar{display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin:16px 0 10px;font-size:13px}
.cprev{display:grid;grid-template-columns:1.4fr 1.4fr 1fr;gap:12px}
.cbox{margin:0;border:1px solid var(--line);border-radius:12px;padding:12px}
.cbox svg{width:100%;height:auto;display:block}
.cbox figcaption{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
.chk{width:100%;border-collapse:collapse;font-size:14px}
.chk td{padding:8px 4px;border-bottom:1px solid #F0ECE5}
.chk td:nth-child(3){font-family:ui-monospace,monospace;font-size:13px}
.chk td:last-child{text-align:right}
.pp{display:inline-flex;vertical-align:middle;margin-right:4px}

 {id:'p-carmine',n:'카민 (코치닐)',e:'Carmine',h:'#960018',y:1520,era:'16세기 유럽 전래',o:'멕시코·페루의 연지벌레',

 {id:'p-mummy',n:'머미 브라운',e:'Mummy Brown',h:'#8F4B28',y:1600,era:'16~20세기',o:'이집트 미라',

 {id:'p-prussian',n:'프러시안 블루',e:'Prussian Blue',h:'#0B3D5C',y:1706,era:'1706년 무렵 · 베를린',o:'우연한 실험',
  story:['베를린의 물감 제조업자 디스바흐가 붉은 안료를 만들려다 오염된 재료 때문에 우연히 얻은 짙은 청색입니다. 최초의 근대 합성 안료로 꼽힙니다.','값싸고 안정적이어서 유럽은 물론 일본에도 퍼졌고, 호쿠사이의 「가나가와 앞바다의 높은 파도」의 깊은 파랑에도 쓰였습니다. 지금은 탈륨·방사성 세슘 중독 해독제로도 쓰입니다.']},
 {id:'p-scheele',n:'셸레 그린',e:"Scheele's Green",h:'#478800',y:1775,era:'1775년 · 스웨덴',o:'아비산구리(비소 화합물)',

 {id:'p-chrome',n:'크롬 옐로',e:'Chrome Yellow',h:'#FFA700',y:1810,era:'19세기 초',o:'크롬산납',

 {id:'p-mauve',n:'모브 (모베인)',e:'Mauveine',h:'#8D029B',y:1856,era:'1856년 · 런던',o:'최초의 합성 염료',

 {id:'p-vanta',n:'반타블랙',e:'Vantablack',h:'#050505',y:2014,era:'2014년 · 영국',o:'탄소 나노튜브 코팅',

/* ================= COLOR MATH ================= */
const clamp=(v,a=0,b=255)=>Math.min(b,Math.max(a,v));
function normHex(s){s=String(s).trim().replace(/^#/,'').toLowerCase();if(/^[0-9a-f]{3}$/.test(s))s=s.split('').map(c=>c+c).join('');return /^[0-9a-f]{6}$/.test(s)?s:null}
function hexToRgb(h){h=normHex(h);return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return [r,g,b].map(v=>Math.round(clamp(v)).toString(16).padStart(2,'0')).join('')}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;const d=mx-mn;
 if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}return[h,s,l]}
function hslToRgb(h,s,l){h=((h%360)+360)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let[r,g,b]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return[(r+m)*255,(g+m)*255,(b+m)*255]}

const lin=v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4};

function rgbToLab(r,g,b){const R=lin(r),G=lin(g),B=lin(b);
 let x=(R*.4124564+G*.3575761+B*.1804375)/.95047,y=(R*.2126729+G*.7151522+B*.0721750),z=(R*.0193339+G*.1191920+B*.9503041)/1.08883;
 const f=t=>t>216/24389?Math.cbrt(t):(24389/27*t+16)/116;x=f(x);y=f(y);z=f(z);return[116*y-16,500*(x-y),200*(y-z)]}
function labToLch([L,a,b]){let h=Math.atan2(b,a)*180/Math.PI;if(h<0)h+=360;return[L,Math.hypot(a,b),h]}
function de2000(p,q){const[L1,a1,b1]=p,[L2,a2,b2]=q,rad=Math.PI/180;
 const C1=Math.hypot(a1,b1),C2=Math.hypot(a2,b2),Cm=(C1+C2)/2,G=.5*(1-Math.sqrt(Cm**7/(Cm**7+25**7)));
 const a1p=(1+G)*a1,a2p=(1+G)*a2,C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
 const hh=(b,a)=>{if(!a&&!b)return 0;let x=Math.atan2(b,a)/rad;return x<0?x+360:x};
 const h1p=hh(b1,a1p),h2p=hh(b2,a2p),dLp=L2-L1,dCp=C2p-C1p;
 let dhp=0;if(C1p*C2p){dhp=h2p-h1p;if(dhp>180)dhp-=360;else if(dhp<-180)dhp+=360}
 const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp*rad/2),Lpm=(L1+L2)/2,Cpm=(C1p+C2p)/2;
 let hpm=h1p+h2p;if(C1p*C2p){hpm=Math.abs(h1p-h2p)>180?(h1p+h2p<360?(h1p+h2p+360)/2:(h1p+h2p-360)/2):(h1p+h2p)/2}
 const T=1-.17*Math.cos((hpm-30)*rad)+.24*Math.cos(2*hpm*rad)+.32*Math.cos((3*hpm+6)*rad)-.2*Math.cos((4*hpm-63)*rad);
 const dT=30*Math.exp(-(((hpm-275)/25)**2)),RC=2*Math.sqrt(Cpm**7/(Cpm**7+25**7));
 const SL=1+.015*(Lpm-50)**2/Math.sqrt(20+(Lpm-50)**2),SC=1+.045*Cpm,SH=1+.015*Cpm*T,RT=-Math.sin(2*dT*rad)*RC;
 return Math.sqrt((dLp/SL)**2+(dCp/SC)**2+(dHp/SH)**2+RT*(dCp/SC)*(dHp/SH))}
function lum(r,g,b){return .2126*lin(r)+.7152*lin(g)+.0722*lin(b)}
function contrast(c1,c2){const a=lum(...c1),b=lum(...c2);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)}

 if(s<.12||l<.07||l>.96)return'neutral';
 if(h>=12&&h<50&&(l<.42||(s<.5&&l<.8)))return'brown';
 if((h<12||h>=345)&&l>=.75)return'pink';
 if(h<12||h>=345)return'red';
 if(h>=300)return'pink';
 if(h<40)return'orange';if(h<70)return'yellow';if(h<160)return'green';if(h<195)return'cyan';if(h<255)return'blue';return'purple'}
const CB={prot:[[.152286,1.052583,-.204868],[.114503,.786281,.099216],[-.003882,-.048116,1.051998]],

 trit:[[1.255528,-.076749,-.178779],[-.078411,.930809,.147602],[.004733,.691367,.3039]]};

function parseQuery(q){q=q.trim();let h=normHex(q);if(h)return h;
 const m=q.match(/^(?:rgb\s*\()?\s*(\d{1,3})\s*[,\s]\s*(\d{1,3})\s*[,\s]\s*(\d{1,3})\s*\)?$/i);
 if(m&&[m[1],m[2],m[3]].every(v=>+v<=255))return rgbToHex(+m[1],+m[2],+m[3]);return null}
function searchBox(id){return `<div class="search" id="${id}"><div class="search-row">

 <button class="btn" data-act="go">${t('찾기','Search')}</button></div><div class="sugg"></div></div>`}
function bindSearch(id){const root=document.getElementById(id);if(!root)return;const inp=root.querySelector('input[type=text]'),sg=root.querySelector('.sugg'),pk=root.querySelector('.picker');let items=[],sel=0;
 const render=()=>{const q=inp.value.trim();items=[];if(!q){sg.style.display='none';return}
  const hx=parseQuery(q);if(hx)items.push({hx,label:'#'+hx.toUpperCase()+t(' 색 페이지 열기',' — open color page'),sub:''});
  const ql=q.toLowerCase();ALL.filter(c=>c.n.includes(q)||c.e.toLowerCase().includes(ql)||(c.hj&&c.hj.includes(q))).slice(0,8).forEach(c=>items.push({hx:c.hx,label:nm(c),sub:alt(c)}));
  if(!items.length){sg.innerHTML=`<a>${t('일치하는 색이 없어요. HEX 코드로 검색해 보세요.','No match. Try a HEX code.')}</a>`;sg.style.display='block';return}
  sel=0;sg.innerHTML=items.map((it,i)=>`<a href="${link(it.hx)}" class="${i===sel?'sel':''}"><span class="sw" style="background:#${it.hx}"></span><span>${esc(it.label)} <span style="color:var(--sub)">${esc(it.sub)}</span></span><span class="hx">#${it.hx.toUpperCase()}</span></a>`).join('');sg.style.display='block'};
 inp.addEventListener('input',render);
 inp.addEventListener('keydown',e=>{const as=sg.querySelectorAll('a[href]');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!as.length)return;sel=(sel+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as.forEach((a,i)=>a.classList.toggle('sel',i===sel))}
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();render();if(items[sel])location.hash='c-'+items[sel].hx}
  if(e.key==='Escape')sg.style.display='none'});
 inp.addEventListener('blur',()=>setTimeout(()=>sg.style.display='none',180));
 root.querySelector('[data-act=go]').onclick=()=>{render();if(items[0])location.hash='c-'+items[0].hx};
 pk.addEventListener('change',()=>location.hash='c-'+normHex(pk.value));}

 </div>
 <div>${t(`<p>오방색은 <b>청·적·황·백·흑</b> 다섯 가지 색으로, 각각 동·남·중앙·서·북의 방위와 목·화·토·금·수의 오행에 대응합니다.</p>

 `<p>Obangsaek are five colors — <b>blue, red, yellow, white and black</b> — matched to the east, south, center, west and north, and to the elements wood, fire, earth, metal and water.</p>

 <h2>${t('전통색 이름','Traditional Color Names')}</h2><p class="lead">${t('식물·광물·곡식 등 자연에서 이름을 얻은 색들입니다.','Colors named after plants, minerals and grains.')}</p>
 <div class="tcards">${KOREAN.filter(k=>k.g==='trad').map(tcard).join('')}</div>
 <h2>${t('같은 이름, 다른 색','Same Name, Different Color')}</h2><p class="lead">${t('색 이름은 언어와 문화, 시대에 따라 달라집니다.','Color names shift with language, culture and time.')}</p>
 <div class="vs">
  <div class="card">${vsPair('#2C3E8C','#000080',t('남색','Nam'),'Navy')}<h3 class="serif">${t('남색 ≠ 네이비','Nam ≠ Navy')}</h3><p>${t('남색은 염료 식물 쪽(藍)에서, 네이비는 18세기 영국 해군 제복 색에서 이름이 왔습니다. 비슷해 보여도 출발점이 전혀 다릅니다.','Korean nam comes from the indigo plant (藍); navy comes from the 18th-century Royal Navy uniform. Similar shades, entirely different origins.')}</p></div>

  <div class="card">${vsPair('#FFD7B5','#FBCEB1',t('연주황','Yeonjuhwang'),t('살구색','Salgusaek'))}<h3 class="serif">${t('살색 → 연주황 → 살구색','“Skin color” → Light orange → Apricot')}</h3><p>${t('2001년 국가인권위원회가 ‘살색’이 특정 피부색만을 뜻해 차별적이라 권고하자 2002년 ‘연주황’으로 바뀌었고, 어린이들이 한자어가 어렵다고 다시 진정해 2005년 ‘살구색’이 되었습니다.','In 2001 Korea’s National Human Rights Commission found the crayon name salsaek (“skin color”) discriminatory. It became yeonjuhwang (light orange) in 2002, then salgusaek (apricot) in 2005 after children petitioned that the Sino-Korean word was too hard.')}</p></div>
 </div>`;
}

function viewColor(hx){
 const rgb=hexToRgb(hx),hsl=rgbToHsl(...rgb),hsv=rgbToHsv(...rgb),cmyk=rgbToCmyk(...rgb),lab=rgbToLab(...rgb),lch=labToLch(lab);
 const named=curatedFor(hx),fam=family(rgb),tc=textOn(rgb);
 const near=nearest(lab,6,named?hx:null);
 const top=near[0];
 const Lw=lab[0]>85?t('아주 밝은','very light'):lab[0]>65?t('밝은','light'):lab[0]>40?t('중간 밝기의','mid-tone'):lab[0]>20?t('어두운','dark'):t('아주 어두운','very dark');
 const Cw=lch[1]<8?t('무채색에 가까운','near-neutral'):lch[1]<25?t('차분한','muted'):lch[1]<55?t('선명한','vivid'):t('매우 선명한','highly saturated');
 const deWord=d=>d<1?t('눈으로 구별하기 어려울 만큼 같음','practically identical'):d<3?t('아주 비슷함','very similar'):d<6?t('비슷함','similar'):d<12?t('닮음','related'):t('계열이 같음','same family');
 const title=named?nm(named):(top.d<3?'≈ '+nm(top.c):'#'+hx.toUpperCase());
 const sub=named?alt(named):(top.d<3?t('가장 가까운 이름: ','Closest name: ')+nm(top.c)+' ('+alt(top.c)+')':t('이름 없는 색 · 가장 가까운 이름은 ','Unnamed color · closest name: ')+nm(top.c));
 const f=(v,d=0)=>(+v).toFixed(d);
 const rows=[['HEX','#'+hx.toUpperCase()],['RGB',`rgb(${rgb.join(', ')})`],['HSL',`hsl(${f(hsl[0])}, ${f(hsl[1]*100)}%, ${f(hsl[2]*100)}%)`],['HSV',`hsv(${f(hsv[0])}, ${f(hsv[1]*100)}%, ${f(hsv[2]*100)}%)`],['CMYK',`cmyk(${cmyk.join('%, ')}%)`],['LAB',`lab(${f(lab[0],1)} ${f(lab[1],1)} ${f(lab[2],1)})`],['LCH',`lch(${f(lch[0],1)} ${f(lch[1],1)} ${f(lch[2])})`]];
 const rot=d=>rgbToHex(...hslToRgb(hsl[0]+d,hsl[1],hsl[2]));
 const harms=[[t('보색','Complementary'),'Complementary',[0,180]],[t('유사색','Analogous'),'Analogous',[-30,0,30]],[t('삼각 배색','Triadic'),'Triadic',[0,120,240]],[t('분할 보색','Split complementary'),'Split',[0,150,210]],[t('사각 배색','Tetradic'),'Tetradic',[0,90,180,270]]];
 const sw=(h,cur)=>{const r=hexToRgb(h);return `<a href="${link(h)}" ${cur?'class="cur"':''} style="background:#${h};color:${textOn(r)}">${h.toUpperCase()}</a>`};
 const tints=[.85,.7,.55,.4,.2].map(v=>rgbToHex(...rgb.map(c=>c+(255-c)*v)));
 const shades=[.2,.4,.55,.7,.85].map(v=>rgbToHex(...rgb.map(c=>c*(1-v))));
 const cw=contrast(rgb,[255,255,255]),cbk=contrast(rgb,[0,0,0]);
 const bd=r=>`<span class="badge ${r>=4.5?'ok':'no'}">AA ${r>=4.5?'✓':'✕'}</span><span class="badge ${r>=7?'ok':'no'}">AAA ${r>=7?'✓':'✕'}</span><span class="badge ${r>=3?'ok':'no'}">${t('큰 글씨','Large')} ${r>=3?'✓':'✕'}</span>`;
 const tags=[`<span class="tag">${t(famName(fam)+' 계열',famName(fam)+' family')}</span>`];
 if(named&&named.t==='korean')tags.push(`<span class="tag">${t('한국 전통색','Korean traditional')}${named.g==='obang'?t(' · 오방색',' · Obangsaek'):named.g==='ogan'?t(' · 오간색',' · Ogansaek'):''}</span>`);
 if(named&&named.t==='pigment')tags.push(`<span class="tag">${t('역사적 안료','Historical pigment')} · ${esc(era(named))}</span>`);
 const paras=named?(named.story?story(named):named.d?[desc(named)]:null):null;
 const storyHtml=paras?`<div class="story" style="border-left-color:${named.h}">
   <div class="kicker">${named.t==='pigment'?t('안료 이야기','Pigment story'):t('한국의 색','Korean color')}</div>
   <h3 class="serif">${esc(nm(named))} ${named.hj?`<span style="font-weight:400;color:var(--sub)">${esc(named.hj)}</span>`:''}</h3>
   ${named.t==='pigment'?`<div class="meta"><span>${t('시기','Period')} · ${esc(era(named))}</span><span>${t('원료','Source')} · ${esc(orig(named))}</span></div>`:''}
   ${named.g==='obang'?`<div class="meta"><span>${t('방위','Direction')} · ${ob(named,'dir')}</span><span>${t('오행','Element')} · ${ob(named,'el')}</span><span>${t('계절','Season')} · ${ob(named,'season')}</span></div>`:''}
   ${named.mix?`<div class="meta"><span>${t(`${BYID[named.mix[0]].n} + ${BYID[named.mix[1]].n} 사이의 간색`,`Intermediate color between ${BYID[named.mix[0]].e.split(' (')[0]} and ${BYID[named.mix[1]].e.split(' (')[0]}`)}</span></div>`:''}
   ${paras.map(p=>`<p>${esc(p)}</p>`).join('')}
   <p style="font-size:12.5px;color:var(--sub);margin-top:10px">${t('※ 화면의 HEX 값은 대표 근사값입니다.','※ The HEX value shown is a representative approximation.')}</p></div>`:'';
 const prev=(parseInt(hx,16)-1+0x1000000)%0x1000000,next=(parseInt(hx,16)+1)%0x1000000;
 const P=n=>n.toString(16).padStart(6,'0');
 app.innerHTML=`
 <div class="cp-hero" style="background:#${hx};color:${tc};${lab[0]>94?'border:1px solid var(--line)':''}">
  <div class="cp-nav"><button data-copy="#${hx.toUpperCase()}">${t('HEX 복사','Copy HEX')}</button><button id="rnd2">${t('무작위 색 →','Random →')}</button></div>
  <div><div class="kicker" style="color:inherit;opacity:.75">${named?t('이름 있는 색','Named color'):t('자동 생성 페이지','Auto-generated page')}</div>
   <h1 class="serif">${esc(title)}</h1><div class="en">${esc(sub)}</div><div class="tags">${tags.join('')}</div></div>
  <div class="codes">#${hx.toUpperCase()} · RGB ${rgb.join(', ')} · HSL ${f(hsl[0])}°, ${f(hsl[1]*100)}%, ${f(hsl[2]*100)}%</div>
 </div>
 <p class="auto-desc">${t(
  `이 색은 <b>${famName(fam)} 계열</b>의 <b>${Lw} ${Cw}</b> 색입니다. 이름 있는 색 가운데 가장 가까운 것은 <a href="${link(top.c.hx)}"><b>${esc(nm(top.c))}</b></a>(${esc(top.c.e)})으로, 색차 ΔE ${f(top.d,1)} — ${deWord(top.d)}.${named?'':' 이 페이지는 HEX 코드로부터 자동으로 만들어졌습니다.'}`,
  `This is a <b>${Lw}, ${Cw}</b> color in the <b>${famName(fam)} family</b>. The closest named color is <a href="${link(top.c.hx)}"><b>${esc(nm(top.c))}</b></a> (${esc(top.c.n)}), with a color difference of ΔE ${f(top.d,1)} — ${deWord(top.d)}.${named?'':' This page was generated automatically from its HEX code.'}`)}</p>
 ${storyHtml}
 <h2>${t('색 코드','Color Codes')}</h2>
 <div class="two">
  <div class="panel"><h3>${t('표기법별 값','Values by notation')}</h3><table class="codes-table">${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td><td><button class="copy" data-copy="${v}">${t('복사','Copy')}</button></td></tr>`).join('')}</table></div>
  <div class="panel"><h3>${t('가까운 이름 있는 색','Nearest named colors')} <span style="font-weight:400;color:var(--sub);font-size:13px">CIEDE2000</span></h3><div class="near">${near.map(({c,d})=>`<a href="${link(c.hx)}"><span class="sw" style="background:${c.h}"></span><div><b>${esc(nm(c))}</b><span>${esc(alt(c))}${typeLabel(c)?' · '+typeLabel(c):''}</span></div><div class="de">ΔE ${f(d,1)}<br>#${c.hx.toUpperCase()}</div></a>`).join('')}</div></div>
 </div>
 <h2>${t('배색','Harmonies')}</h2><p class="lead">${t('색상환에서 각도를 돌려 만든 조합입니다. 색을 누르면 그 색으로 이동합니다.','Combinations made by rotating around the color wheel. Click any swatch to go there.')}</p>
 <div class="harm">${harms.map(([k,e,ds])=>`<div><div class="h-name">${k} ${L==='ko'?`<span>${e}</span>`:''}</div><div class="row">${ds.map(d=>sw(rot(d))).join('')}</div></div>`).join('')}</div>
 <h2>${t('밝게 · 어둡게','Tints & Shades')}</h2>
 <div class="scale">${tints.map(h=>sw(h)).join('')}${sw(hx,true)}${shades.map(h=>sw(h)).join('')}</div>
 <h2>${t('접근성','Accessibility')}</h2>
 <div class="two">
  <div class="panel"><h3>${t('글자 대비','Text contrast')} <span style="font-weight:400;color:var(--sub);font-size:13px">WCAG 2.x</span></h3><div class="contrast">
   <div style="background:#${hx};color:#fff"><b>${t('흰 글씨','White text')} ${f(cw,2)}:1</b><div style="margin-top:6px">${bd(cw)}</div></div>
   <div style="background:#${hx};color:#000"><b>${t('검은 글씨','Black text')} ${f(cbk,2)}:1</b><div style="margin-top:6px">${bd(cbk)}</div></div></div>
   <p style="font-size:12.5px;color:var(--sub);margin:10px 0 0">${t('본문 글자는 4.5:1(AA) 이상, 큰 제목은 3:1 이상을 권장합니다.','Body text should reach 4.5:1 (AA); large headings 3:1.')}</p></div>
  <div class="panel"><h3>${t('색각 이상 시뮬레이션','Color-vision simulation')}</h3><div class="cb">
   <div><i style="background:#${hx}"></i>${t('일반 시각','Typical vision')}</div>
   <div><i style="background:#${simCB(rgb,CB.prot)}"></i>${t('적색맹<br>(1형)','Protanopia')}</div>
   <div><i style="background:#${simCB(rgb,CB.deut)}"></i>${t('녹색맹<br>(2형)','Deuteranopia')}</div>
   <div><i style="background:#${simCB(rgb,CB.trit)}"></i>${t('청색맹<br>(3형)','Tritanopia')}</div></div></div>
 </div>
 <h2>${t('이 색 활용하기','Use This Color')}</h2>
 <div class="panel use"><button class="btn" id="to-outfit">${t('이 색 상의로 코디해 보기','Try it as a top')}</button><button class="btn ghost" id="to-coat">${t('코트 색으로 코디해 보기','Try it as a coat')}</button><button class="btn ghost" id="to-chart">${t('이 색으로 차트 팔레트 만들기','Build a chart palette from it')}</button>
  <p>${(()=>{const sf=seasonFit(lab);return sf.d<12?t(`퍼스널 컬러로는 <b>${SEASONS[sf.k].n}</b> 팔레트의 ‘${sf.c[0]}’${(c=>{const k=c.charCodeAt(c.length-1)-0xAC00;return k>=0&&k<11172&&k%28?'과':'와'})(sf.c[0])} 가까운 색이에요 (ΔE ${sf.d.toFixed(1)}).`,`In personal-color terms, it is close to “${sf.c[1]}” in the <b>${SEASONS[sf.k].e}</b> palette (ΔE ${sf.d.toFixed(1)}).`):t('특정 계절 팔레트에 뚜렷이 속하지 않는 색이에요.','This color doesn’t clearly belong to any one seasonal palette.')})()} <a href="#personal">${t('퍼스널 컬러 알아보기 →','Explore personal color →')}</a></p></div>
 <div style="display:flex;gap:8px;margin-top:28px;flex-wrap:wrap">

 </div>`;

function labToLin([L,a,b]){const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200,e=216/24389,k=24389/27;
 const xr=fx**3>e?fx**3:(116*fx-16)/k,yr=L>k*e?fy**3:L/k,zr=fz**3>e?fz**3:(116*fz-16)/k;
 const X=xr*.95047,Y=yr,Z=zr*1.08883;
 return[3.2404542*X-1.5371385*Y-.4985314*Z,-.969266*X+1.8760108*Y+.041556*Z,.0556434*X-.2040259*Y+1.0572252*Z]}
const inG=v=>v.every(x=>x>=-.0005&&x<=1.0005);
const linHex=v=>rgbToHex(...v.map(x=>delin(clamp(x,0,1))));
function lchHex(L,C,h,strict){let c=C;for(let i=0;i<60;i++){const v=labToLin([L,c*Math.cos(h*Math.PI/180),c*Math.sin(h*Math.PI/180)]);if(inG(v))return linHex(v);if(strict)return null;c=c*.92-.2;if(c<=0)c=0}return linHex(labToLin([L,0,0]))}
const hd=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
const info=hx=>{const rgb=hexToRgb(hx),lab=rgbToLab(...rgb),lch=labToLch(lab);return{hx,rgb,lab,lch,L:lab[0],C:lch[1],H:lch[2]}};
const grayHex=rgb=>{const v=delin(lum(...rgb));return rgbToHex(v,v,v)};

function outfitRecs(){
 const o=OUT,slot=o.slot;
 const nb={coat:['top','bottom'],top:o.coatOn?['coat','bottom']:['bottom'],bottom:['top',...(o.coatOn?['coat']:[])],shoes:['bottom',...(o.coatOn?['coat']:['top'])]}[slot];
 const main=info(o[nb[0]]),others=nb.map(k=>info(o[k]));
 const mainNeutral=isBasicHx(main.hx)||main.C<12;
 const g={safe:[],refined:[],accent:[]};
 GARM.forEach(c=>{
  if(others.some(x=>de2000(x.lab,c.lab)<7))return;
  const dL=Math.abs(c.L-main.L),dh=hd(c.H,main.H),dC=Math.abs(c.C-main.C);
  if(c.basic){if(dL>=12)g.safe.push(c);return}
  if(mainNeutral){(c.C>45?g.accent:g.refined).push(c);return}
  if(dh<22&&dL>=16)g.safe.push(c);
  else if(dL<=18&&dC<=22&&dh>=25&&dh<=115)g.refined.push(c);
  else if(dh>=115&&c.C<=62)g.accent.push(c);
 });
 g.safe.sort((a,b)=>Math.abs(b.L-main.L)-Math.abs(a.L-main.L));
 return{g,main,nb};
}

 if(o.coatOn){const C=info(o.coat);if(C.L<40&&T.L<40)out.push(['mid',t('코트와 이너가 모두 어두워 얼굴 주변이 무거워 보일 수 있어요. 밝은 이너가 얼굴을 환하게 해 줘요.','Coat and inner are both dark, which can feel heavy near the face. A light inner brightens it.')]);
  else if(Math.abs(C.L-T.L)>=20)out.push(['ok',t('코트와 이너의 명암 대비가 좋아 얼굴 쪽에 시선이 모여요.','Good contrast between coat and inner draws the eye to the face.')]);}
 const S=info(o.shoes);
 if(de2000(S.lab,B.lab)<10)out.push(['ok',t('신발을 하의 색과 이어 다리가 길어 보이는 효과가 있어요.','Shoes continue the bottom color, visually lengthening the legs.')]);

   </div>
   <div class="simbar">${[['none',t('일반','Typical')],['prot',t('적색맹','Protan')],['deut',t('녹색맹','Deutan')],['trit',t('청색맹','Tritan')],['gray',t('흑백','Grayscale')]].map(([k,l])=>`<button data-sim="${k}" class="${CH.sim===k?'on':''}">${l}</button>`).join('')}<span class="muted">${t('← 다른 눈으로 미리보기','← preview as others see it')}</span></div>
   ${chartSVG(view)}
   <div class="panel" style="margin-top:16px"><h3>${t('구별성 점검','Distinguishability check')} <span class="muted" style="font-weight:400;font-size:13px">${CH.type==='cat'?t('모든 색 쌍 중 가장 비슷한 쌍','closest pair among all colors'):t('이웃한 단계끼리','between adjacent steps')}</span></h3>
    <table class="chk">${rows.map(([lbl,m,kind,mode])=>{const gk=grade(m.v,kind);return `<tr><td>${lbl}</td><td><span class="pp"><i style="background:#${simList([pal[m.i]],mode)[0]}"></i><i style="background:#${simList([pal[m.j]],mode)[0]}"></i></span> ${m.i+1} & ${m.j+1}</td><td>${kind==='gl'?'ΔL':'ΔE'} ${m.v.toFixed(1)}</td><td><span class="badge g-${gk}">${gradeTxt(gk)}</span></td></tr>`}).join('')}
     ${CH.type!=='cat'?'':`<tr><td>${t('배경 대비','Contrast vs background')}</td><td>${t('가장 낮은 색','Lowest')}</td><td>${cmin.toFixed(2)}:1</td><td><span class="badge g-${grade(cmin,'c')}">${gradeTxt(grade(cmin,'c'))}</span></td></tr>`}</table>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">${t('기준: 범주형은 색차 ΔE 20 이상 좋음·10 미만 주의, 순차·발산형은 이웃 단계 ΔE 10 이상 좋음 · 흑백 명도차 ΔL 10(순차·발산 7) 이상 좋음 · 그래프 요소의 배경 대비 3:1 이상 권장(WCAG 1.4.11). 범주형 색이 많을수록 구별이 어려워지니, 6개를 넘으면 라벨을 직접 붙이거나 강조형을 고려하세요. 발산형은 양쪽이 같은 밝기로 대칭이라 흑백에서는 좌우 구분이 안 되므로, 인쇄용이라면 0 기준선이나 라벨을 함께 쓰세요.','Thresholds: categorical ΔE ≥ 20 good, < 10 low; sequential/diverging adjacent steps ΔE ≥ 10 good · grayscale ΔL ≥ 10 (7 for ordered) good · graphics contrast ≥ 3:1 (WCAG 1.4.11). With more than ~6 categories, label series directly or use the highlight style. Diverging palettes are symmetric in lightness, so left and right sides look alike in grayscale — add a zero line or labels for print.')}</p>
   </div>
  </div>
 </div>`;
 const rer=()=>viewChart();
 app.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{CH.type=b.dataset.type;if(CH.type!=='cat'&&CH.n>9)CH.n=9;rer()});
 app.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{CH.bg=b.dataset.bg;rer()});
 app.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{CH.sim=b.dataset.sim;rer()});
 const st=$('#cstyle');if(st)st.onchange=e=>{CH.style=e.target.value;rer()};
 const cn=$('#cn');cn.oninput=e=>{$('#nval').textContent=e.target.value};cn.onchange=e=>{CH.n=+e.target.value;rer()};
 const cb=$('#cbase');if(cb)cb.onchange=e=>{CH.base=normHex(e.target.value);rer()};
 const ct=$('#cbaseT');if(ct)ct.onchange=e=>{const h=parseQuery(e.target.value);if(h){CH.base=h;rer()}else toast(t('올바른 HEX 코드를 입력하세요','Enter a valid HEX code'))};
 const c2=$('#cbase2');if(c2)c2.onchange=e=>{CH.base2=normHex(e.target.value);rer()};
 const a2=$('#cauto2');if(a2)a2.onclick=()=>{CH.base2=null;rer()};
}

/* ================= ROUTER ================= */
function route(keepScroll){
 const h=location.hash.replace(/^#/,'')||'home';let r=h;
 const site=t('색채의 세계','Color Atlas');
 window.onresize=null;
 if(h.startsWith('c-')&&normHex(h.slice(2))){const hx=normHex(h.slice(2));viewColor(hx);r='color';const c=curatedFor(hx);document.title=(c?nm(c):'#'+hx.toUpperCase())+' · '+site}
 else if(h==='atlas'){viewAtlas();document.title=t('색상 지도','Atlas')+' · '+site}
 else if(h==='korean'){viewKorean();document.title=t('한국의 색','Korean Colors')+' · '+site}
 else if(h==='pigments'){viewPigments();document.title=t('안료 이야기','Pigments')+' · '+site}
 else if(h==='outfit'){viewOutfit();r='match';document.title=t('코디 매칭','Outfit Match')+' · '+site}
 else if(h==='personal'){viewPersonal();r='match';document.title=t('퍼스널 컬러','Personal Color')+' · '+site}
 else if(h==='chart'){viewChart();r='match';document.title=t('차트 팔레트','Chart Palette')+' · '+site}
 else{viewHome();r='home';document.title=t('색채의 세계 · Color Atlas','Color Atlas · 색채의 세계')}
 document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
 if(keepScroll!==true)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route());
renderChrome();route();

</script>
</body>
</html>
